[package]
name = "castline"
version = "1.0.0"
description = "A lightweight, local-first library for prompts, templates, notes & SOPs with live {{variables}} and reusable profiles."
authors = ["Castline contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "castline_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = "0.4"
dirs = "6"

# Outbound connectors: a small blocking HTTPS client to POST to a Make/n8n
# webhook and read the response (rustls TLS via ureq's default features).
ureq = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

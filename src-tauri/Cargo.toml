[package]
name = "castline"
version = "1.1.3"
description = "A local template library for any text you reuse frequently: AI prompts, email templates, notes and multi-step SOPs."
authors = ["Castline contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "castline_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Launch on login (default on, toggleable in Settings).
tauri-plugin-autostart = "2"
# Remember window size/position across restarts.
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = "0.4"
dirs = "6"

# Cryptographically-secure randomness for the inbound-endpoint bearer token, and
# constant-time comparison for checking it (no timing side-channel on auth).
getrandom = "0.2"
subtle = "2"

# Outbound connectors: a small blocking HTTPS client to POST to a Make/n8n
# webhook and read the response (rustls TLS via ureq's default features).
ureq = "2"
# Inbound HTTP endpoints: a tiny loopback server a Make/n8n HTTP module POSTs to
# (Create / Update profile). Small, synchronous, no async runtime.
tiny_http = "0.12"

# Embedded AI agent: a real PTY (ConPTY on Windows) to run the user's `claude`
# CLI, and a file-watcher so external/agent edits to the JSON stores reload live.
portable-pty = "0.9"
notify = "6"

# Store (MSIX) builds can't use the Run key the autostart plugin writes — Windows
# virtualizes it into the package, so nothing launches. Packaged builds drive the
# StartupTask declared in Package.appxmanifest instead.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
